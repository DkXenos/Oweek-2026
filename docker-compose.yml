services:
  db:
    image: postgres:16-alpine
    container_name: oweek2026-db
    privileged: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oweek_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-oweek2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oweek_user} -d ${POSTGRES_DB:-oweek2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: oweek2026-migrate
    privileged: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oweek_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oweek2026}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oweek2026-app
    privileged: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oweek_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oweek2026}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
