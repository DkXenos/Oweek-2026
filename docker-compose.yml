version: '3.8'
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password_rahasia
      POSTGRES_DB: magnify_db
    ports:
      - "5435:5432"

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password_rahasia@db:5432/magnify_db
    depends_on:
      - db