version: "3.8"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: magnify_db

      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_rahasia}
    ports:
      - "5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password_rahasia}@db:5432/magnify_db

      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
